; Комментарий

; Файлы формата INI (от англ. Initialization file) — это конфигурационные файлы,
; которые содержат параметры и настройки для различных программ и операционных систем.
; Они имеют простой текстовый формат, что делает их легко читаемыми и редактируемыми
; как человеком, так и программами.

; Основные характеристики INI-файлов:
; 1. Структура:
;   - Секции: Обозначаются квадратными скобками [SectionName].
;   - Параметры: Записываются в формате ключ=значение.
; 2. Пример INI-файла:

[General]
appname=MyApp
version=1.0

[Settings]
theme=dark
autosave=true
